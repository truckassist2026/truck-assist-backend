spring.application.name=truck-assist-backend

server.port=${PORT:8080}

# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history

# =====================================================
# HIKARI
# =====================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.flywaydb=DEBUG

# =====================================================
# AUTHENTICATION
# =====================================================

truckassist.auth.otp.length=6
truckassist.auth.otp.expiry-minutes=5
truckassist.auth.otp.max-attempts=5
truckassist.auth.otp.resend-seconds=60

# Development only
truckassist.auth.otp.dev-mode=false

# JWT
truckassist.auth.jwt.expiry-minutes=60
truckassist.auth.jwt.secret=${JWT_SECRET}